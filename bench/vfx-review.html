<!doctype html><meta charset="utf-8"><base href="/">
<title>Weapon and elemental VFX production review</title>
<style>body{margin:0;background:#526b50}canvas{display:block}</style>
<script src="/vendor/laya.core.js"></script><script src="/vendor/laya.webgl.js"></script>
<script type="module">
import {drawBuffEffect} from '/dist/buffs/buff-visuals.js';
import {drawEvolutionState,drawEvolutionBurst} from '/dist/buffs/buff-evolution-visuals.js';
import {renderBuffs} from '/dist/buffs/buff-renderer.js';
import {lightningStroke,paintFlameShot,flameBurst,burningGround,castFlash,drawBladeOrbit,bladePulse} from '/dist/rendering/skill-visuals.js';
import {project,emptyLoadout} from '/dist/shared/model.js';
import {heroArt} from '/dist/rendering/hero-art.js';
import {PlayerAtlas} from '/dist/rendering/player-atlas.js';
import {routeVfx,vfxAtlas} from '/dist/rendering/vfx-atlas.js';
import {CombatAccentBudget,dashWake,impactFlecks} from '/dist/rendering/combat-accents.js';
import {drawHitFeedback} from '/dist/rendering/hit-feedback.js';
import {paintHostileShot,hostileShotPose} from '/dist/rendering/projectile-presentation.js';
import {drawBuffMark,drawBuffStatus,drawBuffTransfer} from '/dist/buffs/buff-state-visuals.js';
Laya.init(1024,960,Laya.WebGL);Laya.stage.bgColor='#526b50';
await new Promise(resolve=>heroArt().whenReady(resolve));
const floorArt=new Laya.Sprite(),floor=new Laya.Sprite(),actors=new Laya.Sprite(),overlayArt=new Laya.Sprite(),overlay=new Laya.Sprite(),labels=new Laya.Sprite();
for(const n of [floorArt,floor,actors,overlayArt,overlay,labels])Laya.stage.addChild(n);
routeVfx(floor.graphics,floorArt.graphics);routeVfx(overlay.graphics,overlayArt.graphics);vfxAtlas();
const label=(text,x,y)=>{const n=new Laya.Text();n.text=text;n.fontSize=16;n.color='#f7edce';n.pos(x,y);labels.addChild(n);};
const hero=new PlayerAtlas(true);
const person=(x,y)=>{const n=new Laya.Sprite();hero.paint(n.graphics,emptyLoadout('storm'),{direction:1,face:1,back:false,moving:false},0);n.pos(x,y);actors.addChild(n);};
window.vfxReview={paint(mode='buffs',age=.08,level=3,detail=5){
 floorArt.graphics.clear();overlayArt.graphics.clear();floor.graphics.clear();overlay.graphics.clear();floorArt.destroyChildren();overlayArt.destroyChildren();floor.destroyChildren();overlay.destroyChildren();actors.destroyChildren();labels.destroyChildren();
 label(mode+' / level '+level+' / detail '+detail+' / age '+age,20,16);
 const elements=['fire','ice','lightning','force'],kinds=['bolt','blast','field','orbit'];
 if(mode==='buffs')for(const [row,kind]of kinds.entries())for(const [col,element]of elements.entries()){
  const x=128+col*256,y=165+row*220,pr=(a,b)=>{const q=project(a,b);return{x:q.x+x,y:q.y+y};};
  const e={kind,element,x:0,y:0,vx:480,vy:0,age,level};
  drawBuffEffect(overlay.graphics,floor.graphics,pr,e,detail);
  if(kind==='field')person(x,y+7);
  label(kind+' / '+element,x-75,y+65);
 }
 else if(mode==='weapons'){
  const place=(fn,x,y,parent=overlay)=>{const n=new Laya.Sprite();n.pos(x,y);parent.addChild(n);const raster=new Laya.Sprite();raster.pos(x,y);(parent===floor?floorArt:overlayArt).addChild(raster);routeVfx(n.graphics,raster.graphics);fn(n.graphics);};
  person(150,230);place(g=>castFlash(g,0,0,0,0,age/.3,'#d6b0ff',true),150,175);
  lightningStroke(overlay.graphics,165,180,430,180,age,Math.max(0,1-age/.17),'#d6b0ff',false);
  place(g=>drawHitFeedback(g,{x:0,y:0,life:Math.max(0,.18-age),max:.18,tx:0,ty:0}),430,206);label('storm / chain and impact',70,290);
  const shot=new Laya.Sprite();paintFlameShot(shot.graphics,680,0);shot.pos(650,180);actors.addChild(shot);
  place(g=>flameBurst(g,0,0,105,Math.min(1,age/.25),detail),800,220);label('flame / shot and burst',570,290);
  place(g=>burningGround(g,0,0,85,age,detail),220,600,floor);label('flame / ground',150,680);
  place(g=>{drawBladeOrbit(g,0,0,age,.22*(1-Math.min(1,age/.22)),150,5,0);bladePulse(g,0,0,150,0,Math.min(1,age/.22));},700,650);person(700,650);label('blade / orbit and release',590,770);
 }
 else if(mode==='player-stages'){
  const place=(fn,x,y)=>{const n=new Laya.Sprite(),raster=new Laya.Sprite();n.pos(x,y);raster.pos(x,y);overlay.addChild(n);overlayArt.addChild(raster);routeVfx(n.graphics,raster.graphics);fn(n.graphics);};
  for(const [i,t]of [0,.3,.7,1].entries()){
   const cx=128+i*256;label('lifetime '+Math.round(t*100)+'%',cx-65,70);
   place(g=>{lightningStroke(g,-90,-26,85,-26,t*.17,1-t,'#d6b0ff',false);},cx,190);
   place(g=>drawHitFeedback(g,{x:0,y:0,life:1-t,max:1,tx:0,ty:0}),cx+85,190);
   label('storm',cx-25,265);
   if(t<1)place(g=>paintFlameShot(g,680,0),cx-65,410);
   place(g=>flameBurst(g,0,0,105,t,detail),cx+45,430);
   place(g=>drawHitFeedback(g,{x:0,y:0,life:1-t,max:1,tx:.4,ty:1}),cx+45,510);
   label('flame / burst + embers',cx-90,570);
   place(g=>{drawBladeOrbit(g,0,0,t*.22,.22*(1-t),72,3);bladePulse(g,0,0,72,0,t);},cx,760);
   person(cx,760);place(g=>drawHitFeedback(g,{x:0,y:0,life:1-t,max:1,tx:.4,ty:2}),cx,845);
   label('blade / orbit + cut',cx-80,905);
  }
 }
 else if(mode==='build-states'){
  const place=(fn,x,y)=>{const n=new Laya.Sprite(),r=new Laya.Sprite(),f=new Laya.Sprite(),fr=new Laya.Sprite();for(const o of [n,r,f,fr])o.pos(x,y);overlay.addChild(n);overlayArt.addChild(r);floor.addChild(f);floorArt.addChild(fr);routeVfx(n.graphics,r.graphics);routeVfx(f.graphics,fr.graphics);fn(n.graphics,f.graphics);};
  for(const [i,branch]of [undefined,'trail','furnace'].entries()){
   const x=170+i*342;place((g,f)=>drawBuffEffect(g,f,project,{kind:'field',element:'fire',x:0,y:0,radius:70,level:3,age,branch},detail),x,190);person(x,190);label(branch||'ordinary burning field',x-95,260);
  }
  for(let i=0;i<4;i++){
   const x=128+i*256,branch=i<2?'spread':'charge',ice=i<2?'shards':'prison';
   person(x,440);place((g,f)=>{drawBuffMark(g,0,0,'lightning',{stacks:i+1,life:9,lock:0,source:{branch}});drawBuffMark(g,0,0,'ice',{stacks:i<2?i+1:i===2?3:5,life:4,lock:0,source:{branch:ice}});drawBuffStatus(g,f,project,{x:0,y:0},{slow:2,burn:2},age);},x,440);
   label(branch+' + '+ice,x-85,505);
  }
  label('separate thunder / frost lanes; frost on feet = slow, not a full freeze',115,565);
  for(const [i,kind]of ['reforge','shard','arc','detonate'].entries()){
   const x=128+i*256;place((g,f)=>{if(kind==='detonate')drawEvolutionBurst(g,f,project,kind,0,0,.2,5,detail,'charge');else drawBuffTransfer(g,f,project,{kind,branch:kind==='arc'?'spread':'furnace',x:-35,y:35,tx:35,ty:-35,age:.08,max:1,life:.8});},x,755);
   label(['inward reforge','outward ice shards','spread direction','single-target charge'][i],x-100,840);
  }
 }
 else if(mode==='enemy-shots'){
  const colors=['#c99bef','#c29ce4','#efab82'];
  for(let row=0;row<3;row++){
   const y=180+row*245;label(['mage / needle','elite / heavy crystal','Boss / forked crown'][row],65,y-75);
   for(let i=0;i<8;i++){
    const n=new Laya.Sprite();n.pos(100+i*118,y);overlayArt.addChild(n);routeVfx(n.graphics,n.graphics);
    paintHostileShot(n.graphics,Math.cos(i*Math.PI/4)*600,Math.sin(i*Math.PI/4)*600,colors[row]);
    const p=hostileShotPose(6-age);n.scale(p.scale,p.scale);n.alpha=p.alpha;
   }
  }
  for(let i=0;i<4;i++){const n=new Laya.Sprite();n.pos(160+i*230,885);overlayArt.addChild(n);routeVfx(n.graphics,n.graphics);paintFlameShot(n.graphics,600,0);}
  label('friendly / round amber core and separate flame tail',65,930);
 }
 else if(mode==='accents'){
  const place=(fn,x,y)=>{const n=new Laya.Sprite();n.pos(x,y);overlay.addChild(n);const raster=new Laya.Sprite();raster.pos(x,y);overlayArt.addChild(raster);routeVfx(n.graphics,raster.graphics);fn(n.graphics);};
  for(let i=0;i<4;i++){
   const t=i*.23;place(g=>dashWake(g,{x:0,y:0,life:1-t,max:1,tx:0}),135+i*245,150);person(135+i*245,150);
  }label('dash / tapered wake, age 0 to .69',70,210);
  for(let i=0;i<3;i++)for(let ty=0;ty<3;ty++)place(g=>drawHitFeedback(g,{x:0,y:0,life:1-i*.3,max:1,tx:.4,ty}),200+i*300,310+ty*100);
  label('storm / flame / blade: independent impact silhouettes',70,580);
  for(let i=0;i<4;i++){
   place(g=>paintHostileShot(g,Math.cos(i*Math.PI/2)*600,Math.sin(i*Math.PI/2)*600,'#c99bef'),140+i*240,650);
   place(g=>paintFlameShot(g,Math.cos(i*Math.PI/2)*600,Math.sin(i*Math.PI/2)*600),140+i*240,710);
  }label('hostile arrowheads / friendly amber flames',70,755);
  const budget=new CombatAccentBudget();budget.reset(detail,60,100);let shown=0;
  for(let i=0;i<60;i++)if(budget.take('impact')){shown++;place(g=>impactFlecks(g,{x:0,y:0,life:.6,max:1,tx:24,color:'#dfbc86',kind:'impact'},budget.detail),120+i*110,855);}
  label('dense combat: '+shown+' / 60 repeated generic impact accents',70,920);
 }
 else {
  const target={x:0,y:0,dead:false},state={links:[{a:{x:-80,y:0},b:{x:80,y:0},level}],seeds:[{x:-80,y:0,level},{x:80,y:0,level}],thunder:new Map([[target,{stacks:2,life:2}]]),frost:new Map([[{x:240,y:-240,dead:false},{stacks:3,life:2}]])};
  const pr=(a,b)=>{const q=project(a,b);return{x:q.x+320,y:q.y+300};};
  drawEvolutionState(overlay.graphics,floor.graphics,pr,state,()=>true,detail);
  for(const [i,kind]of ['detonate','shatter'].entries()){
   const pr=(a,b)=>{const q=project(a,b);return{x:q.x+256+i*512,y:q.y+520};};
   drawEvolutionBurst(overlay.graphics,floor.graphics,pr,kind,0,0,Math.min(1,age/.3),level,detail);label(kind,206+i*512,600);
  }
  renderBuffs({effects:[],feedback:[],statuses:new Map([[{x:0,y:0,dead:false},{burn:2,slow:2}]]),evolutions:{links:[],seeds:[],thunder:new Map(),frost:new Map()},visualBudget:20,visualTime:age},overlay.graphics,(a,b)=>{const q=project(a,b);return{x:q.x+512,y:q.y+800};},floor.graphics,()=>true);person(512,800);label('burn + frost status',430,865);
 }
 return {mode,age,level,detail,atlas:vfxAtlas().status};
}};
window.vfxReview.paint();
</script>
