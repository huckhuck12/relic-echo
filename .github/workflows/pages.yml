name: Build and deploy game to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Check production entry and touch interactions in Chromium
        run: node scripts/check-mobile-browser.mjs
        env:
          PERF_BROWSER: google-chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-browser-diagnostics
          path: |
            artifacts/mobile-check-*/*.png
            artifacts/mobile-check-*/report.json
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
